<div id="principal">
  <div class="cabecera-vista">
    <div>
      <h1>Roles y permisos</h1>
      <div class="texto-suave">Define qué puede hacer cada persona en el sistema.</div>
    </div>
    <button type="button" class="boton primario" id="nuevo-rol">Nuevo rol</button>
  </div>

  <section class="caja formulario-en-linea" id="formulario-rol" aria-labelledby="titulo-formulario-rol" hidden>
    <strong id="titulo-formulario-rol">Nuevo rol</strong>
    <div class="dos-campos">
      <div>
        <label for="rol-nombre">Nombre</label>
        <input id="rol-nombre" class="campo" autocomplete="off" placeholder="Por ejemplo: Supervisor">
      </div>
      <div>
        <label for="rol-descripcion">Descripción</label>
        <input id="rol-descripcion" class="campo" autocomplete="off" placeholder="Qué hace este rol">
      </div>
    </div>
    <div class="acciones-fila margen-superior-grande">
      <button type="button" class="boton primario" id="guardar-rol">Guardar rol</button>
      <button type="button" class="boton" id="cancelar-rol">Cancelar</button>
    </div>
  </section>

  <div class="disposicion-roles">
    <section class="caja" aria-label="Roles">
      <div id="lista-roles">{{{roles}}}</div>
    </section>

    <div class="columna-roles">
      <section class="caja" aria-labelledby="rol-titulo">
        <div class="cabecera-vista">
          <div>
            <h2 id="rol-titulo"></h2>
            <div class="texto-suave" id="rol-descripcion-actual"></div>
          </div>
          <div class="acciones-fila">
            <button type="button" class="boton" id="editar-rol">Editar rol</button>
            <button type="button" class="boton peligro" id="eliminar-rol">Eliminar</button>
          </div>
        </div>
        <div class="confirmacion" id="confirmar-eliminar-rol" hidden>
          <span id="texto-eliminar-rol"></span>
          <button type="button" class="boton peligro" id="eliminar-rol-si">Sí, eliminar</button>
          <button type="button" class="boton" id="eliminar-rol-no">Cancelar</button>
        </div>
        <div class="desplazable margen-superior-grande">
          <table>
            <thead>
              <tr><th>Módulo</th><!--{{{encabezados}}}--></tr>
            </thead>
            <tbody id="matriz-permisos"></tbody>
          </table>
        </div>
      </section>

      <section class="caja" aria-labelledby="titulo-personas">
        <div class="cabecera-vista">
          <h2 id="titulo-personas">Personas</h2>
          <button type="button" class="boton" id="agregar-persona">Agregar persona</button>
        </div>
        <div class="formulario-en-linea" id="formulario-persona" hidden>
          <div class="dos-campos">
            <div>
              <label for="persona-nombre">Nombre</label>
              <input id="persona-nombre" class="campo" autocomplete="off">
            </div>
            <div>
              <label for="persona-correo">Correo</label>
              <input id="persona-correo" class="campo" type="email" autocomplete="off" placeholder="nombre@tienda.com">
            </div>
          </div>
          <label for="persona-rol">Rol</label>
          <select id="persona-rol" class="campo"></select>
          <div class="acciones-fila margen-superior-grande">
            <button type="button" class="boton primario" id="guardar-persona">Guardar persona</button>
            <button type="button" class="boton" id="cancelar-persona">Cancelar</button>
          </div>
        </div>
        <div class="desplazable">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th class="centro">Activo</th></tr></thead>
            <tbody id="lista-personas"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<template id="encabezado-accion">
  <th class="centro">{{etiqueta}}</th>
</template>

<template id="tarjeta-rol">
  <button type="button" class="tarjeta-rol" data-rol="{{id}}" aria-current="{{actual}}">
    <span><strong>{{nombre}}</strong> {{{insignia}}}</span>
    <small class="texto-suave">{{personas}}</small>
  </button>
</template>

<template id="insignia-protegido">
  <span class="insignia suave">Protegido</span>
</template>

<template id="fila-permiso">
  <tr><td>{{modulo}}</td><!--{{{celdas}}}--></tr>
</template>

<template id="celda-permiso">
  <td class="centro"><input type="checkbox" data-modulo="{{modulo}}" data-accion="{{accion}}" aria-label="{{descripcion}}" {{{estado}}}></td>
</template>

<template id="celda-vacia">
  <td class="centro sin-permiso" aria-label="No aplica">–</td>
</template>

<template id="opcion-rol">
  <option value="{{id}}" {{{seleccion}}}>{{nombre}}</option>
</template>

<template id="fila-persona">
  <tr>
    <td>{{nombre}}</td>
    <td class="texto-suave">{{correo}}</td>
    <td><select class="campo" data-persona="{{id}}" aria-label="Rol de {{nombre}}">{{{opciones}}}</select></td>
    <td class="centro">
      <label class="interruptor interruptor-solo">
        <input type="checkbox" role="switch" data-activo="{{id}}" aria-label="Activo: {{nombre}}" {{{marcado}}}>
        <span class="interruptor-pista"></span>
      </label>
    </td>
  </tr>
</template>
