<div id="principal">
  <button type="button" class="boton primario" id="nueva-actividad" data-accion-cabecera>Nueva actividad</button>

  <section class="caja formulario-en-linea" id="formulario-actividad" aria-labelledby="titulo-formulario-actividad" hidden>
    <strong id="titulo-formulario-actividad">Nueva actividad o tarea</strong>
    <div class="tres-campos">
      <div>
        <label for="actividad-cliente">Cliente</label>
        <select id="actividad-cliente" class="campo">{{{opcionesCliente}}}</select>
      </div>
      <div>
        <label for="actividad-tipo">Tipo</label>
        <select id="actividad-tipo" class="campo">{{{opcionesActividad}}}</select>
      </div>
      <div>
        <label for="actividad-descripcion">Descripción</label>
        <input id="actividad-descripcion" class="campo" maxlength="300" autocomplete="off" placeholder="Qué se habló o qué hay que hacer">
      </div>
    </div>
    <div class="tres-campos" id="campos-tarea" hidden>
      <div>
        <label for="actividad-vence">Fecha de la tarea</label>
        <input id="actividad-vence" class="campo" type="date" value="{{hoy}}">
      </div>
      <div>
        <label for="actividad-responsable">Responsable</label>
        <select id="actividad-responsable" class="campo">{{{opcionesResponsable}}}</select>
      </div>
    </div>
    <div id="campo-resultado" hidden>
      <label for="actividad-resultado">Resultado</label>
      <input id="actividad-resultado" class="campo" maxlength="300" autocomplete="off" placeholder="Opcional: en qué quedó">
    </div>
    <div class="acciones-fila margen-superior-grande">
      <button type="button" class="boton primario" id="guardar-actividad">Guardar</button>
      <button type="button" class="boton" id="cancelar-actividad">Cancelar</button>
    </div>
  </section>

  <section class="caja separacion-inferior" aria-labelledby="titulo-tareas">
    <strong id="titulo-tareas">Tareas pendientes</strong>
    <div class="texto-suave" id="alcance-tareas"></div>
    <div id="cuadricula-tareas"></div>
  </section>

  <section class="caja" aria-labelledby="titulo-historial">
    <strong id="titulo-historial">Historial de actividades</strong>
    <div class="confirmacion" id="confirmar-eliminar-actividad" hidden>
      <span id="texto-eliminar-actividad"></span>
      <button type="button" class="boton peligro" id="eliminar-actividad-si">Sí, eliminar</button>
      <button type="button" class="boton" id="eliminar-actividad-no">Cancelar</button>
    </div>
    <div id="cuadricula-actividades"></div>
  </section>

  <div id="ficha-actividad"></div>
</div>

<template id="acciones-tarea">
  <div class="acciones-fila">
    <button type="button" class="boton" data-ficha="{{id}}">Ficha</button>
    {{{editar}}}
    {{{eliminar}}}
    {{{completar}}}
  </div>
</template>

<template id="acciones-actividad">
  <div class="acciones-fila">
    <button type="button" class="boton" data-ficha="{{id}}">Ficha</button>
    {{{editar}}}
    {{{eliminar}}}
  </div>
</template>

<template id="boton-editar">
  <button type="button" class="boton" data-editar="{{id}}">Editar</button>
</template>

<template id="boton-eliminar">
  <button type="button" class="boton peligro" data-eliminar="{{id}}">Eliminar</button>
</template>

<template id="boton-completar">
  <button type="button" class="boton primario" data-completar="{{id}}">Marcar hecha</button>
</template>

<template id="estado-tarea">
  <span class="insignia {{clase}}">{{texto}}</span>
</template>

<template id="enlace-cliente">
  <a href="clientes.html?ficha={{id}}">{{nombre}}</a>
</template>

<template id="opcion">
  <option value="{{valor}}">{{texto}}</option>
</template>
