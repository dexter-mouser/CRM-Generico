<template id="fila-resultado">
  <div class="fila-cuadricula fila-resultado" role="option" id="resultado-{{posicion}}" data-id="{{id}}">
    <div>{{id}}</div>
    <div>{{referencia}}</div>
    <div class="texto-producto">{{nombre}}</div>
    <div>{{costo}}</div>
    <div>{{existencias}}</div>
    <div class="texto-suave relleno-resto">Clic o Enter para agregar</div>
  </div>
</template>

<template id="busqueda-reciente">
  <button type="button" class="reciente" data-columna="{{columna}}" data-texto="{{texto}}"><span class="texto-suave">{{etiquetaColumna}}:</span> {{texto}}</button>
</template>
