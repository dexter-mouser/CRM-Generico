<aside id="menu-lateral" aria-label="Menú de la tienda"></aside>

<template id="opcion-enlace">
  <a class="opcion-menu {{clase}}" href="{{id}}.html" aria-label="{{etiqueta}}" title="{{etiqueta}}">{{{icono}}}<span>{{etiqueta}}</span></a>
</template>

<template id="opcion-salir">
  <button type="button" class="opcion-menu" id="cerrar-sesion" aria-label="Cerrar sesión" title="Cerrar sesión">{{{icono}}}<span>Cerrar sesión</span></button>
</template>
